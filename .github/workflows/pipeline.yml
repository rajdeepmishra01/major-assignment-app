name: Build and Push Images

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm install

      - name: Run lint and frontend build
        run: npm run ci

  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: build

    strategy:
      matrix:
        service:
          - frontend
          - auth-service
          - todo-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
          -t $IMAGE_NAME:${{ github.run_number }} \
          -t $IMAGE_NAME:latest \
          ./apps/${{ matrix.service }}

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push $IMAGE_NAME:${{ github.run_number }}
          docker push $IMAGE_NAME:latest
          