name: CI — Build, Test, Scan and Push

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write
  security-events: write   # Trivy SARIF upload to GitHub Security tab
  pull-requests: read      # SonarCloud PR decoration

# ──────────────────────────────────────────────────────────────────────────────
# Job 1 — Lint & frontend build (unchanged gate)
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  lint:
    name: Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm install

      - name: Run lint and frontend build
        run: npm run ci

# ──────────────────────────────────────────────────────────────────────────────
# Job 2 — Unit tests with coverage (auth-service and todo-service)
# ──────────────────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests — ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - todo-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install service dependencies
        working-directory: apps/${{ matrix.service }}
        run: npm install

      - name: Run tests with coverage
        working-directory: apps/${{ matrix.service }}
        run: npm test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: apps/${{ matrix.service }}/coverage/lcov.info
          if-no-files-found: warn

# ──────────────────────────────────────────────────────────────────────────────
# Job 3 — SonarCloud static analysis + quality gate
# ──────────────────────────────────────────────────────────────────────────────
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository (full history for blame)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download auth-service coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-auth-service
          path: apps/auth-service/coverage

      - name: Download todo-service coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-todo-service
          path: apps/todo-service/coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

# ──────────────────────────────────────────────────────────────────────────────
# Job 4 — Build Docker image → Trivy image scan → Push to GHCR
# ──────────────────────────────────────────────────────────────────────────────
  docker:
    name: Build, Scan and Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [lint, test]

    strategy:
      fail-fast: false
      matrix:
        service:
          - frontend
          - auth-service
          - todo-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:${{ github.run_number }} \
            -t $IMAGE_NAME:latest \
            ./apps/${{ matrix.service }}

      - name: Trivy — scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.run_number }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          # Fail the build only for fixable CRITICAL CVEs
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        # Always upload so results are visible even when the scan step failed
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push $IMAGE_NAME:${{ github.run_number }}
          docker push $IMAGE_NAME:latest
