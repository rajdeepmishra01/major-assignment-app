# ──────────────────────────────────────────────────────────────────────────────
# SonarCloud configuration for the Todo Platform monorepo.
#
# ACTION REQUIRED: replace the two placeholder values below with your actual
# SonarCloud project key and organisation slug.
#
#   projectKey format : <github-org>_<repo-name>
#   organization      : your SonarCloud org slug (same as GitHub org, lower-case)
#
# Create a free SonarCloud project at: https://sonarcloud.io/projects/create
# ──────────────────────────────────────────────────────────────────────────────

sonar.projectKey=your-github-org_major-assignment-app
sonar.organization=your-github-org
sonar.projectName=Todo Platform

# ── Sources ───────────────────────────────────────────────────────────────────
sonar.sources=apps/auth-service/src,apps/todo-service/src,apps/frontend/src

sonar.exclusions=\
  **/node_modules/**,\
  apps/frontend/dist/**,\
  **/__tests__/**,\
  **/coverage/**

# ── Test sources ─────────────────────────────────────────────────────────────
sonar.tests=apps/auth-service/src/__tests__,apps/todo-service/src/__tests__
sonar.test.inclusions=**/__tests__/**

# ── Coverage ──────────────────────────────────────────────────────────────────
# lcov reports are generated by vitest --coverage in each service's CI step
sonar.javascript.lcov.reportPaths=\
  apps/auth-service/coverage/lcov.info,\
  apps/todo-service/coverage/lcov.info

sonar.coverage.exclusions=\
  **/__tests__/**,\
  **/vitest.config.js,\
  apps/auth-service/src/server.js,\
  apps/todo-service/src/server.js,\
  apps/frontend/**

sonar.sourceEncoding=UTF-8
