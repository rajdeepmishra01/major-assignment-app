sonar.projectKey=rajdeepmishra01_major-assignment-app
sonar.organization=rajdeepmishra01
sonar.projectName=Todo Platform

# ── Sources (exclude test dirs so SonarCloud counts them separately) ──────────
sonar.sources=apps/auth-service/src,apps/todo-service/src,apps/frontend/src

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/__tests__/**,\
  apps/auth-service/src/server.js,\
  apps/todo-service/src/server.js

# ── Test sources ──────────────────────────────────────────────────────────────
sonar.tests=apps/auth-service/src/__tests__,apps/todo-service/src/__tests__
sonar.test.inclusions=**/*.test.js

# ── Coverage ──────────────────────────────────────────────────────────────────
sonar.javascript.lcov.reportPaths=\
  apps/auth-service/coverage/lcov.info,\
  apps/todo-service/coverage/lcov.info

sonar.coverage.exclusions=\
  apps/frontend/**,\
  **/__tests__/**,\
  **/vitest.config.js

# ── Quality Gate: block the CI step if gate fails ─────────────────────────────
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

sonar.sourceEncoding=UTF-8